<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Н или НН — тренажёр ЕГЭ</title>
<style>
:root{--bg:#eef1fb;--bg2:#f8f4ff;--card:#fff;--tx:#1e2235;--mut:#6c7390;--ac:#5b5bd6;--ac2:#8a5bd6;--ok:#17a45a;--okbg:#e2f7ec;--no:#e0394b;--nobg:#fde9ec;--bd:#e3e6f2;--sh:0 10px 40px rgba(60,60,140,.12);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12141f;--bg2:#1a1530;--card:#1d2030;--tx:#eceefa;--mut:#9aa1c0;--ac:#8d8dff;--ac2:#b58dff;--ok:#4fd68a;--okbg:#123123;--no:#ff7a8a;--nobg:#3a1a21;--bd:#2d3250;--sh:0 10px 40px rgba(0,0,0,.4);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--tx);font:17px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:20px 14px}
.card{width:100%;max-width:640px;background:var(--card);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh);padding:28px 26px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{margin:0 0 6px;font-size:1.6rem;line-height:1.2}
.grad{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.mut{color:var(--mut)}
.hero{text-align:center;padding:10px 0}
.hero .big{font-size:4.2rem;font-weight:800;letter-spacing:2px;margin:6px 0 4px}
.rules{display:grid;gap:10px;margin:20px 0;text-align:left}
.rules div{background:var(--bg);border-radius:14px;padding:10px 14px;font-size:.95rem}
button{-webkit-tap-highlight-color:transparent;outline:none;font:inherit;border:0;cursor:pointer;transition:transform .12s,box-shadow .12s,opacity .2s}
.primary{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-weight:700;border-radius:14px;padding:13px 30px;box-shadow:0 6px 18px rgba(91,91,214,.35)}
@media(hover:hover) and (pointer:fine){.primary:hover{transform:translateY(-2px)}}
@media(prefers-color-scheme:dark){.primary{color:#14152a}}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.92rem;color:var(--mut);margin-bottom:10px}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:22px}
.dots i{flex:1;min-width:8px;height:7px;border-radius:4px;background:var(--bd)}
.dots i.cur{background:var(--ac)}.dots i.ok{background:var(--ok)}.dots i.no{background:var(--no)}
.word{text-align:center;font-size:2.5rem;font-weight:700;letter-spacing:1px;margin:14px 0 8px;word-break:break-word}
.slot{display:inline-block;min-width:2.3em;margin:0 4px;padding:0 6px;border-bottom:4px dashed var(--ac);color:var(--ac);transition:.2s}
.slot.ok{border-bottom:4px solid var(--ok);color:var(--ok);animation:pop .35s}
.slot.no{border-bottom:4px solid var(--no);color:var(--no);animation:shake .4s}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ctx{text-align:center;color:var(--mut);font-size:.97rem;margin:0 0 22px;min-height:1.5em}
.ctx b{color:var(--tx);font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.opt{background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:18px;padding:16px 8px;font-size:2rem;font-weight:800}
.opt small{display:block;font-size:.75rem;font-weight:500;color:var(--mut)}
@media(hover:hover) and (pointer:fine){.opt:hover:not(:disabled){transform:translateY(-3px);border-color:var(--ac);box-shadow:0 8px 20px rgba(91,91,214,.2)}}
.opt:disabled{cursor:default;opacity:.55}
.opt.right{opacity:1;border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.wrong{opacity:1;border-color:var(--no);background:var(--nobg);color:var(--no)}
.fb{border-radius:16px;padding:14px 16px;margin:8px 0 16px;animation:in .3s}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.fb h3{margin:0 0 4px;font-size:1.1rem}
.fb.ok h3{color:var(--ok)}.fb.no h3{color:var(--no)}
.fb p{margin:0;font-size:.97rem}
.next{display:block;margin:0 auto}
.hint{text-align:center;font-size:.8rem;color:var(--mut);margin-top:14px}
.ring{width:170px;height:170px;margin:6px auto 12px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.4rem;font-weight:800}
.ring .n small{font-size:.8rem;font-weight:500;color:var(--mut)}
.res{text-align:center}
.err{list-style:none;padding:0;margin:14px 0;text-align:left}
.err li{background:var(--bg);border-left:4px solid var(--no);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:.95rem}
.err li b{font-size:1.05rem}
.err li span{display:block;color:var(--mut);font-size:.88rem}
@media(max-width:480px){.card{padding:22px 16px}.word{font-size:2rem}}
.step{background:var(--bg);border-radius:18px;padding:16px;margin-bottom:16px;animation:in .3s}
.st-t{font-weight:700;margin-bottom:12px}
.sopts{display:grid;gap:10px}
.sopt{background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;text-align:left;font-size:1rem;font-weight:600}
@media(hover:hover) and (pointer:fine){.sopt:hover:not(:disabled){border-color:var(--ac);transform:translateX(3px)}}
.sopt.wrong{border-color:var(--no);background:var(--nobg);color:var(--no);animation:shake .4s}
.sm{color:var(--no);font-size:.92rem;margin-top:10px}
.tip{background:var(--bg);border-left:4px solid var(--ac);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.95rem}
kbd{font:inherit;font-size:.75rem;background:var(--bd);color:var(--mut);border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:middle}
.ghost{background:transparent;color:var(--ac);border:2px solid var(--ac);border-radius:14px;padding:11px 20px;font-weight:700}
.tg{display:block;text-align:center;margin:0 0 16px;color:var(--mut);font-size:.95rem}
.top a{color:var(--ac);text-decoration:none;font-weight:600}
#modal{display:none;position:fixed;inset:0;background:rgba(10,10,30,.55);align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto;z-index:9}
.mbox{position:relative;background:var(--card);border-radius:22px;max-width:640px;width:100%;padding:24px;box-shadow:var(--sh);animation:in .3s}
.mbox h2{margin:0 0 10px}.x{position:absolute;top:14px;right:14px;background:var(--bg);color:var(--tx);border-radius:50%;width:34px;height:34px}
.alg{padding-left:20px}.alg li{margin:10px 0;font-size:.97rem}
.ex{background:var(--bg);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.9rem}
.sopt small{display:block;font-weight:500;color:var(--mut);font-size:.82rem;margin-left:34px}
.sopt.shk{animation:shake .4s}
</style>
</head>

<li>Слова-исключения <b>запомни</b>:</li></ol>

<div class="ex"><b>нн:</b> доморощенный, желанный, священный, нежданный, негаданный, невиданный, неслыханный, нечаянный, отчаянный, медленный, читанный, недреманный, окаянный, чванный, чеканный, жеманный, деланный, стеклянный, оловянный, деревянный, решённый, купленный, пленный, брошенный, обиженный, смущённый, казнённый, рождённый</div>`;
function modal(){const m=document.getElementById('modal');m.innerHTML=`<div class="mbox"><button class="x" id="mx">✕</button><h2 class="grad">Алгоритм: Н или НН</h2>${SCHEME}</div>`;m.style.display='flex';
 const c=()=>m.style.display='none';document.getElementById('mx').onclick=c;m.onclick=e=>{if(e.target===m)c()}}
function intro(){
 app.innerHTML=`<div class="hero">
 <div class="big grad">Н · НН</div>
 <h1>Тренажёр по орфографии</h1>
 <p class="mut">Задание 15 ЕГЭ: Н и НН в суффиксах прилагательных, причастий, наречий и существительных</p></div>
 <div class="rules">
 <div>🎯 Каждый раз — <b>${Math.min(N,POOL.length)} случайных слов</b> из базы в ${POOL.length} слов.</div>
 <div>🧭 Решайте <b>по алгоритму</b>: определите часть речи, спросите «сочетается с кем-то?», проверьте П·З·С и суффикс, затем выберите «н» или «нн».</div>
 <div>💡 После ответа — правило и «путь» по схеме.</div></div>
 <label class="tg"><input type="checkbox" id="gd" checked> Режим по алгоритму (шаги-подсказки)</label>
 <div style="text-align:center"><button class="primary" id="go">Начать</button> <button class="ghost" id="sc">📋 Схема</button></div>
 <div class="hint">Клавиши: 1, 2, 3 — выбор ответа, Enter — дальше</div>`;
 document.getElementById('go').onclick=()=>{guided=document.getElementById('gd').checked;start()};
 document.getElementById('sc').onclick=modal;
}
function start(){qs=[...POOL].sort(()=>Math.random()-.5).slice(0,Math.min(N,POOL.length));i=0;score=0;streak=0;best=0;res=[];show()}
function br(q){const p=q[8],r=q[5].toLowerCase(),s=q[10];
 if(p==='x')return{t:'x'};
 if(p==='s'||p==='n'){if(!s)return{t:'sn'};
  return{t:'sn',from:s[0]==='P'?{t:'p',pzs:s==='P1'?1:0,z:q[11]}:{t:'adj',o:q[12]}}}
 if(p==='k')return{t:'p',short:1};
 if(p==='p')return{t:'p',pzs:1,z:q[11]};
 if(r.startsWith('отглаг'))return{t:'p',pzs:q[2]===2?1:0,z:q[11]};
 return{t:'adj',o:q[12]}}
function tail(b,r,ns){
 if(b.t==='p'){
  if(!ns)r.push({t:'Причастие краткое?',o:[['y','Да, краткое'],['n','Нет, полное']],c:b.short?'y':'n'});
  if(!b.short)r.push({t:'Что из этого есть в слове?',o:[['p','Приставка'],['d','Зависимое слово'],['s','Совершенный вид'],['o','ова / ева'],['n','Ничего из этого']],c:b.pzs?(b.z?b.z.split(''):['p','d','s','o']):'n'})}
 else r.push({t:'Что в основе и суффиксе прилагательного?',o:[['N','Основа на н'],['M','Основа на -мя'],['E','е','перед нн'],['O','о','перед нн'],['I','и, а, я','перед н'],['X','Исключение']],c:b.o.split('')})}
function steps(q){const b=br(q);if(b.t==='x')return[];const pos=q[8];
 const r=[{t:'Определи часть речи',o:[['a','Прилагательное'],['p','Причастие','сочетается с «кем-то»'],['s','Существительное'],['n','Наречие']],c:pos==='s'?'s':pos==='n'?'n':b.t==='p'?'p':'a'}];
 if(b.t==='sn'){if(!b.from)return num(r);
  r.push({t:'От какого слова образовано?',o:[['a','Прилагательного'],['p','Причастия']],c:b.from.t==='p'?'p':'a'});tail(b.from,r,true)}
 else tail(b,r);
 return num(r)}
function num(r){r.forEach((s,k)=>s.t='Шаг '+(k+1)+'. '+s.t);return r}
function tailPath(b){
 if(b.t==='p')return b.short?'краткое → н':b.pzs?'есть П·З·С/ова/ева → нн':'нет П·З·С → н';
 return b.o.includes('X')?'исключение → по списку':b.o.includes('I')?'и, а, я перед н → н':'основа на н / -мя или е, о перед нн → нн'}
function pathTxt(q){const b=br(q);
 if(b.t==='sn'){const h=(q[8]==='s'?'существительное':'наречие');
  return b.from?h+' → образовано от '+(b.from.t==='p'?'причастия':'прилагательного')+' → '+tailPath(b.from):h+' → столько же н, сколько в исходном слове'}
 if(b.t==='x')return 'слово-исключение → по списку';
 return (b.t==='p'?'сочетается с «кем-то» → причастие → ':'не сочетается → прилагательное → ')+tailPath(b)}
function show(){
 const q=qs[i];locked=false;st=0;S=guided?steps(q):[];
 const dots=qs.map((_,k)=>`<i class="${k<i?res[k].ok?'ok':'no':k===i?'cur':''}"></i>`).join('');
 app.innerHTML=`<div class="top"><span>Слово <b>${i+1}</b> из ${qs.length}</span><span>${streak>1?'🔥 серия '+streak+' · ':''}верно: ${score} · <a href="#" id="sch">📋 схема</a></span></div>
 <div class="dots">${dots}</div>
 <div class="word">${esc(q[0])}<span class="slot" id="slot">?</span>${esc(q[1])}</div>
 <p class="ctx">${q[6]?'… ':''}${esc(q[3])} <b>${esc(q[0])}_${esc(q[1])}</b> ${esc(q[4])}${q[7]?' …':''}</p>
 <div id="panel"></div><div id="fb"></div>
 <button class="primary next" id="nx" style="display:none"></button>`;
 document.getElementById('sch').onclick=e=>{e.preventDefault();modal()};
 draw();
}
function draw(){
 const q=qs[i],p=document.getElementById('panel');
 if(st<S.length){const s=S[st];
  p.innerHTML=`<div class="step"><div class="st-t">${s.t}</div><div class="sopts">${s.o.map((o,k)=>`<button class="sopt" data-v="${o[0]}"><kbd>${k+1}</kbd> ${o[1]}${o[2]?`<small>${o[2]}</small>`:''}</button>`).join('')}</div><div class="sm" id="sm"></div></div>`;
  p.querySelectorAll('.sopt').forEach(b=>b.onclick=()=>step(b));
 }else{
  p.innerHTML=`<div class="opts">
  <button class="opt" data-n="1"><kbd>1</kbd> н<small>одна буква</small></button>
  <button class="opt" data-n="2"><kbd>2</kbd> нн<small>две буквы</small></button></div>`;
  p.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
 }
}
function step(b){const s=S[st];
 if([].concat(s.c).includes(b.dataset.v)){st++;draw()}
 else{b.classList.remove('shk');void b.offsetWidth;b.classList.add('shk')}}
function pick(n){
 if(locked)return;locked=true;
 const q=qs[i],ok=n===q[2];
 if(ok){score++;streak++;best=Math.max(best,streak)}else streak=0;
 res.push({ok,q,n});
 const slot=document.getElementById('slot');
 slot.textContent=NN(q[2]);slot.className='slot '+(ok?'ok':'no');
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;
  if(+b.dataset.n===q[2])b.classList.add('right');else if(+b.dataset.n===n)b.classList.add('wrong')});
 const full=q[0]+NN(q[2])+q[1].replace(/[^\wА-Яа-яЁё]+$/,'');
 document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><h3>${ok?'✓ Верно!':'✗ Не совсем'} — «${esc(full)}»</h3><p>${esc(q[5])}</p><p class="mut" style="margin-top:6px">🧭 Путь по схеме: ${pathTxt(q)}</p></div>`;
 const nx=document.getElementById('nx');nx.style.display='block';
 nx.textContent=i+1<qs.length?'Дальше →':'Результат';nx.onclick=next;nx.focus();
}
function next(){i++;i<qs.length?show():finish()}
function finish(){
 const t=qs.length,p=score/t,C=2*Math.PI*70;
 const msg=p>=.9?'Блестяще! 🏆':p>=.75?'Отличный результат! 🎉':p>=.5?'Неплохо, но есть что повторить 👍':'Стоит потренироваться ещё 💪';
 const bad=res.filter(r=>!r.ok);
 app.innerHTML=`<div class="res"><h1 class="grad">${msg}</h1>
 <div class="ring"><svg width="170" height="170"><circle cx="85" cy="85" r="70" fill="none" stroke="var(--bd)" stroke-width="14"/>
 <circle cx="85" cy="85" r="70" fill="none" stroke="url(#g)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/>
 <defs><linearGradient id="g"><stop offset="0" stop-color="#5b5bd6"/><stop offset="1" stop-color="#b58dff"/></linearGradient></defs></svg>
 <div class="n">${score}/${t}<small>${Math.round(p*100)}%</small></div></div>
 <p class="mut">Лучшая серия правильных ответов: <b>${best}</b></p></div>
 ${bad.length?`<h3>Повторите:</h3><ul class="err">${bad.map(r=>`<li><b>${esc(r.q[0]+NN(r.q[2])+r.q[1].replace(/[^\wА-Яа-яЁё]+$/,''))}</b> <span>вы выбрали «${NN(r.n)}» · ${esc(r.q[5])}<br>🧭 ${pathTxt(r.q)}</span></li>`).join('')}</ul>`:'<p class="res">Ни одной ошибки!</p>'}
 <div style="text-align:center;margin-top:16px"><button class="primary" id="again">Ещё ${Math.min(N,POOL.length)} слов</button> <button class="ghost" id="sc2">📋 Схема</button></div>`;
 document.getElementById('again').onclick=start;document.getElementById('sc2').onclick=modal;
}
document.addEventListener('keydown',e=>{
 const m=document.getElementById('modal');if(e.key==='Escape'&&m.style.display==='flex'){m.style.display='none';return}
 if(!qs||!document.getElementById('panel')||m.style.display==='flex')return;
 if(!locked){const k=+e.key;if(k>=1&&k<=6){const b=document.querySelectorAll('#panel .sopt,#panel .opt')[k-1];if(b&&!b.disabled)b.click()}}
 else if(e.key==='Enter'&&e.target.id!=='nx'){e.preventDefault();next()}
});
intro();
</script>
</body>
</html>
